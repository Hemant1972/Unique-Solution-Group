<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="1" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="groupTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow & Shadow Effects -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starFlare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Emblem / Crest Icon -->
  <g transform="translate(15, 10)">
    <!-- Outer Metallic Ring Arc -->
    <path d="M 120 20 A 70 70 0 1 0 160 115" fill="none" stroke="url(#goldLinear)" stroke-width="7" stroke-linecap="round" filter="url(#subtleGlow)" />
    
    <!-- Inner Accent Arc -->
    <path d="M 115 32 A 56 56 0 1 0 148 108" fill="none" stroke="url(#goldGlow)" stroke-width="2.5" stroke-dasharray="6,3" />

    <!-- 3D Corporate Spark Star -->
    <g transform="translate(156, 115)" filter="url(#starFlare)">
      <!-- Star Core Glow -->
      <circle cx="0" cy="0" r="14" fill="#FBBF24" opacity="0.35" filter="url(#subtleGlow)" />
      <!-- Star Diamond Rays -->
      <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="url(#goldLinear)" />
      <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z" fill="#FFFBEB" />
    </g>
  </g>

  <!-- Corporate Typography Section -->
  <g transform="translate(190, 68)">
    <!-- Primary Brand Title -->
    <text x="0" y="24" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="url(#textGold)">
      UNIQUE SOLUTION
    </text>

    <!-- Sub-Brand Tagline / GROUP -->
    <text x="2" y="62" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="12" fill="url(#groupTeal)">
      GROUP
    </text>

    <!-- Divider Line -->
    <line x1="2" y1="76" x2="380" y2="76" stroke="url(#goldGlow)" stroke-width="1.5" opacity="0.6" />

    <!-- Corporate Slogan -->
    <text x="2" y="92" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#94A3B8">
      CONSULTANTS • SPICES • ENTERPRISES • FOUNDATION
    </text>
  </g>
</svg>